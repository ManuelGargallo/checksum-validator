[project]
name = "checksum-validator"
version = "0.1.0"
description = "A high-performance validation API using the Luhn Algorithm."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ManuelGargallo"},
]
keywords = ["fastapi", "luhn", "checksum", "validation", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.urls]
"Homepage" = "https://github.com/ManuelGargallo/checksum-validator"
"Bug Tracker" = "https://github.com/ManuelGargallo/checksum-validator/issues"

[tool.setuptools]
packages = ["app", "app.core"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Select rules: E (Error), F (Pyflakes), I (Isort), N (Naming), UP (Upgrade)
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
