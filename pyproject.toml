[project]
name = "checksum-validator"
version = "0.1.0"
description = "A validation API using FastAPI to verify numerical check digits."
readme = "README.md"
requires-python = ">=3.11"
# FIX 1: Modern SPDX string format instead of a table
license = "MIT" 
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

# FIX 2: Explicitly guide setuptools to discover only the 'app' directory
[tool.setuptools]
packages = ["app", "app.core"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
